<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피자 수달 더블 빙고 헬퍼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #FFF5E1; /* 부드러운 피자 도우 색상 */
        }
        .title-font { font-family: 'Jua', sans-serif; }
        
        /* 주사위 굴림 애니메이션 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-5deg); }
            20% { transform: translate(-3px, 0px) rotate(5deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(5deg); }
            50% { transform: translate(-1px, 2px) rotate(-5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-5deg); }
            80% { transform: translate(-1px, -1px) rotate(5deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-5deg); }
        }
        .rolling {
            animation: shake 0.3s ease-in-out infinite;
        }
        
        /* 주사위 입체감 효과 */
        .die-shadow {
            box-shadow: inset 0 6px 12px -2px rgba(255, 255, 255, 0.6), 
                        inset 0 -6px 12px -2px rgba(0, 0, 0, 0.2), 
                        0 8px 15px -3px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen pb-10">
    
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col items-center">
        
        <header class="w-full flex justify-between items-center mb-8 border-b-4 border-orange-200 pb-4">
            <div class="flex items-center gap-3">
                <span class="text-4xl">🦦🍕</span>
                <h1 class="text-3xl md:text-4xl title-font text-orange-600 drop-shadow-sm">피자 수달 헬퍼</h1>
            </div>
            <button id="newGameBtn" class="bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white px-5 py-3 rounded-xl shadow-md font-bold transition transform active:scale-95 text-sm md:text-base">
                새 게임 시작
            </button>
        </header>

        <main class="w-full flex flex-col-reverse lg:flex-row gap-8">
            
            <!-- Left Section: Topping Cards -->
            <section class="flex-1 flex flex-col">
                <div class="flex justify-between items-end mb-4 px-1">
                    <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <span>📜</span> 이번 게임의 토핑 카드
                    </h2>
                    <span class="text-sm font-bold text-gray-500 bg-gray-200 px-3 py-1 rounded-full">
                        총 8장 세팅됨
                    </span>
                </div>
                <!-- Cards Grid -->
                <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-5">
                    <!-- Cards will be rendered here by JS -->
                </div>
            </section>

            <!-- Right Section: Dice Roller (Sticky on Desktop) -->
            <section class="w-full lg:w-[22rem] flex-shrink-0 relative">
                <div class="bg-white rounded-3xl shadow-xl p-6 lg:sticky lg:top-6 border-4 border-orange-100">
                    <h2 class="text-xl font-bold text-center mb-6 text-gray-700">🎲 공용 주사위 굴리기</h2>
                    
                    <!-- Dice Visuals -->
                    <div class="flex justify-center gap-6 mb-8">
                        <!-- Red Die -->
                        <div id="redDie" class="w-24 h-24 bg-red-500 rounded-2xl die-shadow grid grid-cols-3 grid-rows-3 p-3 gap-1">
                           <!-- dots generated by js -->
                        </div>
                        <!-- Yellow Die -->
                        <div id="yellowDie" class="w-24 h-24 bg-yellow-400 rounded-2xl die-shadow grid grid-cols-3 grid-rows-3 p-3 gap-1">
                           <!-- dots generated by js -->
                        </div>
                    </div>

                    <!-- Progress tracking -->
                    <div class="mb-6">
                        <div class="flex justify-between text-sm font-bold text-gray-500 mb-2">
                            <span>진행도</span>
                            <span id="rollCountDisplay" class="text-orange-600 text-lg border-b-2 border-orange-200">0 / 25 라운드</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-4 shadow-inner overflow-hidden border border-gray-200">
                            <div id="progressBar" class="bg-gradient-to-r from-orange-400 to-orange-500 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <button id="rollBtn" class="w-full bg-red-500 hover:bg-red-600 active:bg-red-700 text-white text-2xl title-font py-5 rounded-2xl shadow-[0_6px_0_#b91c1c] hover:shadow-[0_4px_0_#b91c1c] active:shadow-none hover:translate-y-[2px] active:translate-y-[6px] transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none disabled:translate-y-0">
                        주사위 굴리기!
                    </button>
                    
                    <!-- Game Over Message -->
                    <div id="gameOverMsg" class="hidden mt-6 text-center animate-bounce">
                        <p class="font-bold text-xl text-blue-600 bg-blue-50 py-3 rounded-xl border-2 border-blue-200">
                            🎉 25라운드 종료!<br><span class="text-base font-normal">시트지 점수를 계산해 주세요.</span>
                        </p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        // --- Game Data: Topping Cards (Translated & Described) ---
        
        const level1Cards = [
            { name: '4 스트레이트 (4 Straight)', points: 2, desc: '4칸의 숫자가 1씩 커지도록 연속되어야 합니다. (예: 1-2-3-4). 나머지 1칸은 상관없습니다.' },
            { name: '3 카드 (3 of a Kind)', points: 2, desc: '3칸의 숫자가 모두 동일해야 합니다. 나머지 2칸은 상관없습니다.' },
            { name: '2 페어 (2 Pairs)', points: 2, desc: '2칸이 같은 숫자이고, 다른 2칸도 같은 숫자여야 합니다.' },
            { name: '더블 2 (Double 2s)', points: 2, desc: '숫자 "2"가 정확히 2칸에만 존재해야 합니다.' },
            { name: '3 스트레이트 (3 Straight)', points: 1, desc: '3칸의 숫자가 1씩 커지도록 연속되어야 합니다. (예: 1-2-3).' },
            { name: '싱글 1 (Single 1)', points: 1, desc: '숫자 "1"이 정확히 1칸에만 존재해야 합니다.' }
        ];

        const level2Cards = [
            { name: '5 스트레이트 (5 Straight)', points: 4, desc: '5칸의 숫자가 모두 1씩 커지도록 연속되어야 합니다. (1-2-3-4-5 또는 2-3-4-5-6)' },
            { name: '트리플 3 (Triple 3)', points: 4, desc: '숫자 "3"이 정확히 3칸에만 존재해야 합니다.' },
            { name: '올 로우 (All Low)', points: 4, desc: '5칸 모두 1, 2, 3 중 하나의 숫자로만 채워져야 합니다.' },
            { name: '올 하이 (All High)', points: 4, desc: '5칸 모두 4, 5, 6 중 하나의 숫자로만 채워져야 합니다.' },
            { name: '로우 섬 10 (Low Sum 10)', points: 4, desc: '5칸 숫자의 합이 10 이하여야 합니다.' },
            { name: '하이 섬 25 (High Sum 25)', points: 4, desc: '5칸 숫자의 합이 25 이상이어야 합니다.' },
            { name: '풀 하우스 (Full House)', points: 4, desc: '3칸이 같은 숫자이고, 나머지 2칸도 같은 숫자여야 합니다.' },
            { name: '링크드 2 페어 (Linked 2 Pairs)', points: 3, desc: '2쌍의 페어가 있으며, 두 페어 숫자의 차이가 정확히 1이어야 합니다. (예: 2,2와 3,3)' },
            { name: '저스트 15 (Just 15)', points: 3, desc: '5칸 숫자의 합이 정확히 15가 되어야 합니다.' },
            { name: '올 디프 (All Diff)', points: 3, desc: '5칸의 숫자가 모두 서로 달라야 합니다.' }
        ];

        const level3Cards = [
            { name: '5 카드 (5 of a Kind)', points: 6, desc: '5칸의 숫자가 모두 동일해야 합니다.' },
            { name: '1-6 온리 (1-6 Only)', points: 6, desc: '5칸 모두 1 또는 6으로만 채워져야 합니다.' },
            { name: '2-5 온리 (2-5 Only)', points: 6, desc: '5칸 모두 2 또는 5로만 채워져야 합니다.' },
            { name: '3-4 온리 (3-4 Only)', points: 6, desc: '5칸 모두 3 또는 4로만 채워져야 합니다.' },
            { name: '링크드 풀 하우스 (Linked Full House)', points: 5, desc: '풀 하우스이면서, 3개인 숫자와 2개인 숫자의 차이가 정확히 1이어야 합니다.' },
            { name: '4 카드 (4 of a Kind)', points: 5, desc: '4칸의 숫자가 모두 동일해야 합니다.' },
            { name: '올 오드 (All Odd)', points: 5, desc: '5칸 모두 홀수(1, 3, 5)로만 채워져야 합니다.' },
            { name: '올 이븐 (All Even)', points: 5, desc: '5칸 모두 짝수(2, 4, 6)로만 채워져야 합니다.' }
        ];

        // --- Game State & Elements ---
        
        let rollCount = 0;
        const MAX_ROLLS = 25;

        const uiElements = {
            redDie: document.getElementById('redDie'),
            yellowDie: document.getElementById('yellowDie'),
            rollBtn: document.getElementById('rollBtn'),
            rollCountDisplay: document.getElementById('rollCountDisplay'),
            progressBar: document.getElementById('progressBar'),
            cardsContainer: document.getElementById('cardsContainer'),
            newGameBtn: document.getElementById('newGameBtn'),
            gameOverMsg: document.getElementById('gameOverMsg')
        };

        // Initialize App
        function init() {
            uiElements.newGameBtn.addEventListener('click', startNewGame);
            uiElements.rollBtn.addEventListener('click', handleRollClick);
            startNewGame();
        }

        // Shuffle Utility
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Core Game Setup
        function startNewGame() {
            // Reset Progress
            rollCount = 0;
            updateRollDisplay();
            uiElements.gameOverMsg.classList.add('hidden');
            
            // Reset Button
            uiElements.rollBtn.disabled = false;
            uiElements.rollBtn.innerText = "주사위 굴리기!";
            uiElements.rollBtn.classList.replace('bg-gray-400', 'bg-red-500');
            uiElements.rollBtn.classList.replace('shadow-[0_6px_0_#9ca3af]', 'shadow-[0_6px_0_#b91c1c]');
            
            // Set initial dice visuals to 1
            renderDie(uiElements.redDie, 1, 'bg-white');
            renderDie(uiElements.yellowDie, 1, 'bg-gray-900');

            // Pick 8 Random Cards
            const pickedLevel1 = shuffleArray(level1Cards).slice(0, 3).map(c => ({...c, level: 1}));
            const pickedLevel2 = shuffleArray(level2Cards).slice(0, 3).map(c => ({...c, level: 2}));
            const pickedLevel3 = shuffleArray(level3Cards).slice(0, 2).map(c => ({...c, level: 3}));
            
            const gameCards = [...pickedLevel1, ...pickedLevel2, ...pickedLevel3];
            renderCards(gameCards);
        }

        // Render Topping Cards HTML
        function renderCards(cards) {
            uiElements.cardsContainer.innerHTML = '';
            
            const levelStyles = {
                1: { badge: 'bg-green-100 text-green-800 border-green-200', border: 'hover:border-green-400' },
                2: { badge: 'bg-blue-100 text-blue-800 border-blue-200', border: 'hover:border-blue-400' },
                3: { badge: 'bg-rose-100 text-rose-800 border-rose-200', border: 'hover:border-rose-400' }
            };
            
            cards.forEach(card => {
                const style = levelStyles[card.level];
                const cardHtml = `
                    <div class="bg-white rounded-2xl shadow-sm border-2 border-transparent ${style.border} p-5 flex flex-col h-full transition-colors duration-300">
                        <div class="flex justify-between items-center mb-3 border-b border-gray-100 pb-2">
                            <span class="text-xs font-bold px-3 py-1 rounded-full border ${style.badge}">Level ${card.level}</span>
                            <span class="text-xl title-font text-orange-500">${card.points} 점</span>
                        </div>
                        <h3 class="font-bold text-lg mb-2 text-gray-800">${card.name}</h3>
                        <p class="text-sm text-gray-600 leading-relaxed flex-grow">${card.desc}</p>
                    </div>
                `;
                uiElements.cardsContainer.innerHTML += cardHtml;
            });
        }

        
        // Draw Dice dots based on value (1-6) on a 3x3 grid
        function renderDie(element, value, dotColorClass) {
            element.innerHTML = '';
            // Array of grid indices for dots (0 to 8)
            const dotPositions = {
                1: [4],
                2: [0, 8],
                3: [0, 4, 8],
                4: [0, 2, 6, 8],
                5: [0, 2, 4, 6, 8],
                6: [0, 2, 3, 5, 6, 8]
            };
            
            const activeDots = dotPositions[value] || [4];

            for(let i = 0; i < 9; i++) {
                const dot = document.createElement('div');
                if(activeDots.includes(i)) {
                    dot.className = `rounded-full w-full h-full shadow-sm ${dotColorClass}`;
                }
                element.appendChild(dot);
            }
        }

        // Handle Roll Animation and Logic
        function handleRollClick() {
            if (rollCount >= MAX_ROLLS) return;

            uiElements.rollBtn.disabled = true;
            uiElements.rollBtn.innerText = "굴러가는 중...";
            uiElements.redDie.classList.add('rolling');
            uiElements.yellowDie.classList.add('rolling');

            // Fast random numbers visual effect
            let ticks = 0;
            const rollInterval = setInterval(() => {
                renderDie(uiElements.redDie, Math.floor(Math.random() * 6) + 1, 'bg-white');
                renderDie(uiElements.yellowDie, Math.floor(Math.random() * 6) + 1, 'bg-gray-900');
                ticks++;
                
                // Stop after ~400ms (8 ticks of 50ms)
                if (ticks >= 8) {
                    clearInterval(rollInterval);
                    finalizeRoll();
                }
            }, 50);
        }

        // Finalize roll outcome
        function finalizeRoll() {
            const finalRed = Math.floor(Math.random() * 6) + 1;
            const finalYellow = Math.floor(Math.random() * 6) + 1;
            
            renderDie(uiElements.redDie, finalRed, 'bg-white');
            renderDie(uiElements.yellowDie, finalYellow, 'bg-gray-900');
            
            uiElements.redDie.classList.remove('rolling');
            uiElements.yellowDie.classList.remove('rolling');
            
            rollCount++;
            updateRollDisplay();
            
            if (rollCount >= MAX_ROLLS) {
                // Game End State
                uiElements.gameOverMsg.classList.remove('hidden');
                uiElements.rollBtn.innerText = "게임 완료";
                uiElements.rollBtn.classList.replace('bg-red-500', 'bg-gray-400');
                uiElements.rollBtn.classList.replace('shadow-[0_6px_0_#b91c1c]', 'shadow-[0_6px_0_#9ca3af]');
            } else {
                // Ready for next roll
                uiElements.rollBtn.disabled = false;
                uiElements.rollBtn.innerText = "주사위 굴리기!";
            }
        }

        function updateRollDisplay() {
            uiElements.rollCountDisplay.innerText = `${rollCount} / ${MAX_ROLLS} 라운드`;
            const percentage = (rollCount / MAX_ROLLS) * 100;
            uiElements.progressBar.style.width = `${percentage}%`;
        }

        // Start the app!
        window.onload = init;

    </script>
</body>
</html>
