<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My Board Game Helpers</title>
    <style>
        body { 
            font-family: 'Pretendard', sans-serif; 
            text-align: center; 
            background-color: #f4f7f6; 
            margin: 0;
            padding: 40px 20px;
        }
        h1 { color: #333; margin-bottom: 40px; }
        
        .container { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            flex-wrap: wrap; /* 카드가 많으면 다음 줄로 넘어가게 설정 */
            max-width: 1000px; /* 화면이 너무 넓어지지 않게 고정 */
            margin: 0 auto; 
        }

        .game-card { 
            padding: 20px; 
            border: none;
            border-radius: 15px; 
            background: white; 
            text-decoration: none; 
            color: #333;
            width: 200px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .game-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            background-color: #fff;
            color: #007bff;
        }

        .game-card h2 { margin: 10px 0; font-size: 1.25rem; }
        .game-card p { font-size: 0.9rem; color: #666; }
    </style>
</head>
