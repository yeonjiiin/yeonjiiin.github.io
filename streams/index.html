<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스트림스 메트로 보조 툴</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f1f5f9; 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; 
            overflow-x: hidden;
        }
        
        /* 지하철 노선 배경 패턴 */
        .metro-bg {
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 32px 32px;
        }

        /* 역명판 스타일 섀도우 */
        .station-sign-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1), inset 0 -4px 0 rgba(0,0,0,0.1);
        }

        /* 애니메이션 */
        @keyframes trainArrive {
            0% { transform: translateX(100%) skewX(-15deg); opacity: 0; }
            70% { transform: translateX(-5%) skewX(5deg); opacity: 1; }
            100% { transform: translateX(0) skewX(0); opacity: 1; }
        }
        .animate-train {
            animation: trainArrive 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* 깜빡이는 LED 효과 */
        .led-blink {
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.3; }
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="metro-bg">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TOTAL_TILES = 42;

        function App() {
            const [deck, setDeck] = useState([]);
            const [history, setHistory] = useState([]);
            const [removedTiles, setRemovedTiles] = useState([]);
            const [currentDraw, setCurrentDraw] = useState(null);
            const [appState, setAppState] = useState('READY'); // READY, NORMAL, REMOVE2, PICK1, END

            // 메트로 테마 색상 설정
            const getTileStyle = (type, value) => {
                if (type === 'special') {
                    if (value === '⭐') return { color: 'text-yellow-500', border: 'border-yellow-400', bg: 'bg-yellow-400', hex: '#eab308' };
                    if (value === '🗑️') return { color: 'text-red-500', border: 'border-red-500', bg: 'bg-red-500', hex: '#ef4444' };
                    if (value === '✌️') return { color: 'text-purple-500', border: 'border-purple-500', bg: 'bg-purple-500', hex: '#a855f7' };
                }
                if (value >= 1 && value <= 10) return { color: 'text-blue-600', border: 'border-blue-500', bg: 'bg-blue-500', hex: '#3b82f6' }; // 1호선
                if (value >= 11 && value <= 19) return { color: 'text-orange-500', border: 'border-orange-500', bg: 'bg-orange-500', hex: '#f97316' }; // 3호선
                if (value >= 20 && value <= 30) return { color: 'text-teal-600', border: 'border-teal-500', bg: 'bg-teal-500', hex: '#14b8a6' }; // 2호선(외곽)
                return { color: 'text-gray-800', border: 'border-gray-800', bg: 'bg-gray-800', hex: '#1f2937' };
            };

            const initGame = () => {
                let initialTiles = [];
                // 숫자 1~10 (각 1개)
                for(let i=1; i<=10; i++) initialTiles.push({ type: 'number', value: i, ...getTileStyle('number', i) });
                // 숫자 11~19 (각 2개)
                for(let i=11; i<=19; i++) {
                    initialTiles.push({ type: 'number', value: i, ...getTileStyle('number', i) });
                    initialTiles.push({ type: 'number', value: i, ...getTileStyle('number', i) });
                }
                // 숫자 20~30 (각 1개)
                for(let i=20; i<=30; i++) initialTiles.push({ type: 'number', value: i, ...getTileStyle('number', i) });
                
                // 특수 타일 3개
                initialTiles.push({ type: 'special', value: '⭐', name: 'star', desc: '원하는 빈칸 1개 조커', ...getTileStyle('special', '⭐') });
                initialTiles.push({ type: 'special', value: '🗑️', name: 'remove2', desc: '주머니에서 2개 영구 제거', ...getTileStyle('special', '🗑️') });
                initialTiles.push({ type: 'special', value: '✌️', name: 'pick1', desc: '2개 중 1개 선택 (제거타일 불가)', ...getTileStyle('special', '✌️') });

                for (let i = initialTiles.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [initialTiles[i], initialTiles[j]] = [initialTiles[j], initialTiles[i]];
                }

                setDeck(initialTiles);
                setHistory([]);
                setRemovedTiles([]);
                setCurrentDraw(null);
                setAppState('READY');
            };

            useEffect(() => {
                initGame();
            }, []);

            const handleDraw = () => {
                if (deck.length === 0) {
                    setAppState('END');
                    return;
                }

                // 뽑을 때마다 애니메이션을 리셋하기 위해 잠시 null 처리
                setCurrentDraw(null);

                setTimeout(() => {
                    let currentDeck = [...deck];
                    const drawnTile = currentDeck.pop();
                    let newDrawData = { main: drawnTile, subs: [], id: Date.now() };

                    if (drawnTile.name === 'remove2') {
                        const sub1 = currentDeck.pop();
                        const sub2 = currentDeck.pop();
                        newDrawData.subs = [sub1, sub2].filter(Boolean);
                        setRemovedTiles(prev => [...prev, ...newDrawData.subs]);
                        setAppState('REMOVE2');
                    } else if (drawnTile.name === 'pick1') {
                        const sub1 = currentDeck.pop();
                        const sub2 = currentDeck.pop();
                        newDrawData.subs = [sub1, sub2].filter(Boolean);
                        setHistory(prev => [...prev, ...newDrawData.subs]); // 환승역 느낌으로 히스토리에 넣음
                        setAppState('PICK1');
                    } else {
                        setHistory(prev => [...prev, drawnTile]);
                        setAppState('NORMAL');
                    }

                    setDeck(currentDeck);
                    setCurrentDraw(newDrawData);
                    
                    if (currentDeck.length === 0) {
                        setTimeout(() => setAppState('END'), 1500);
                    }
                }, 50); // 짧은 딜레이로 리렌더링 강제 (애니메이션 재시작 용도)
            };

            // 메트로 역명판 스타일 메인 렌더러
            const renderStationSign = (tile) => {
                if (!tile) return null;
                
                return (
                    <div className="relative flex flex-col items-center justify-center bg-white rounded-[2rem] station-sign-shadow overflow-hidden border-4 border-gray-200 w-64 h-48 md:w-80 md:h-56">
                        {/* 상/하단 노선 색상 띠 */}
                        <div className={`absolute top-0 w-full h-8 md:h-10 ${tile.bg}`}></div>
                        <div className={`absolute bottom-0 w-full h-8 md:h-10 ${tile.bg}`}></div>
                        
                        {/* 화살표 장식 (다음 역 안내 느낌) */}
                        <div className="absolute top-2 right-4 text-white opacity-80 font-bold hidden md:block">▶</div>
                        <div className="absolute bottom-2 left-4 text-white opacity-80 font-bold hidden md:block">◀</div>
                        
                        {/* 텍스트/숫자 */}
                        <div className={`text-7xl md:text-8xl font-black ${tile.color} z-10 bg-white px-8 py-2 rounded-full border-4 ${tile.border}`}>
                            {tile.value}
                        </div>
                        
                        {tile.type === 'special' && (
                            <div className={`absolute bottom-12 font-bold text-sm md:text-base px-4 py-1 rounded-full text-white ${tile.bg} shadow-md`}>
                                {tile.desc}
                            </div>
                        )}
                    </div>
                );
            };

            // 노선도 마커 스타일 작은 렌더러 (히스토리용)
            const renderRouteMarker = (tile, idx) => {
                return (
                    <div key={idx} className="relative group cursor-default flex-shrink-0">
                        {/* 중앙 연결선 */}
                        <div className={`absolute top-1/2 left-full w-4 h-2 -translate-y-1/2 z-0 ${tile.bg} opacity-50`}></div>
                        
                        {/* 환승역/일반역 마커 */}
                        <div className={`w-14 h-14 md:w-16 md:h-16 rounded-full bg-white border-4 flex items-center justify-center font-black text-xl md:text-2xl z-10 relative shadow-sm ${tile.border} ${tile.color}`}>
                            {tile.value}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col">
                    
                    {/* 상단 네비게이션바 (플랫폼 전광판 테마) */}
                    <div className="bg-slate-900 text-white px-6 py-4 shadow-lg flex justify-between items-center border-b-4 border-slate-700">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-orange-500 via-teal-500 to-blue-600 rounded-full flex items-center justify-center border-2 border-white shadow-[0_0_10px_rgba(255,255,255,0.5)]">
                                <span className="font-black text-xl">M</span>
                            </div>
                            <div>
                                <h1 className="text-2xl font-black tracking-widest text-slate-100">STREAMS <span className="text-teal-400">METRO</span></h1>
                            </div>
                        </div>
                        <button onClick={initGame} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold border border-slate-600 transition-colors text-sm">
                            초기화
                        </button>
                    </div>

                    <div className="flex-1 max-w-5xl mx-auto w-full p-4 md:p-8 flex flex-col">
                        
                        {/* 전광판 (남은 타일 수) */}
                        <div className="bg-black rounded-lg p-3 md:p-4 border-4 border-gray-800 mb-6 flex justify-between items-center shadow-inner">
                            <div className="flex flex-col">
                                <span className="text-orange-500 text-xs md:text-sm font-bold tracking-widest uppercase">Approaching Train</span>
                                <span className="text-yellow-400 text-lg md:text-xl font-mono led-blink">당 역 접 근</span>
                            </div>
                            <div className="text-right">
                                <span className="text-gray-500 text-xs font-bold uppercase">REMAINING TILES</span>
                                <div className="font-mono text-2xl md:text-3xl text-emerald-400 font-bold">
                                    {String(deck.length).padStart(2, '0')} <span className="text-gray-600 text-lg">/ {TOTAL_TILES}</span>
                                </div>
                            </div>
                        </div>

                        {/* 메인 스테이지 */}
                        <div className="flex-1 flex flex-col items-center justify-center min-h-[350px] relative">
                            {appState === 'READY' && (
                                <div className="text-center bg-white p-10 rounded-[2rem] shadow-xl border-2 border-gray-100 max-w-md w-full">
                                    <div className="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                        <span className="text-5xl">🎫</span>
                                    </div>
                                    <h2 className="text-3xl font-black text-gray-800 mb-2">운행 준비 완료</h2>
                                    <p className="text-gray-500 font-medium">티켓 발권 버튼을 눌러<br/>첫 번째 타일을 뽑아주세요.</p>
                                </div>
                            )}

                            {appState === 'END' && (
                                <div className="text-center bg-white p-10 rounded-[2rem] shadow-xl border-4 border-teal-500 max-w-md w-full">
                                    <div className="text-6xl mb-4">🏁</div>
                                    <h2 className="text-3xl font-black text-gray-800 mb-2">종착역 도착</h2>
                                    <p className="text-gray-600">모든 노선의 운행이 종료되었습니다.<br/>각자의 시트지에서 점수를 계산해주세요!</p>
                                </div>
                            )}

                            {currentDraw && appState !== 'READY' && appState !== 'END' && (
                                <div key={currentDraw.id} className="flex flex-col items-center animate-train w-full">
                                    
                                    {appState === 'NORMAL' && (
                                        <div className="flex flex-col items-center">
                                            {renderStationSign(currentDraw.main)}
                                            {currentDraw.main.value === '⭐' && (
                                                <div className="mt-6 bg-yellow-100 text-yellow-700 px-6 py-2 rounded-full font-bold text-lg animate-bounce border-2 border-yellow-300">
                                                    원하는 빈칸 1개에 별을 그리세요!
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {appState === 'REMOVE2' && (
                                        <div className="flex flex-col items-center w-full max-w-2xl bg-white p-8 rounded-[2rem] shadow-xl border-4 border-red-500">
                                            <div className="bg-red-500 text-white px-6 py-2 rounded-full font-black text-xl mb-6 shadow-md">
                                                🚨 타일 2개 제거 🚨
                                            </div>
                                            <p className="text-gray-600 mb-8 font-medium text-center">
                                                특수 타일 효과로 인해 아래 두 역(타일)은<br/>이번 노선에서 영구적으로 제외됩니다.
                                            </p>
                                            <div className="flex justify-center gap-6 md:gap-12 w-full">
                                                {currentDraw.subs.map((t, idx) => (
                                                    <div key={idx} className="relative">
                                                        <div className="absolute inset-0 bg-red-500/20 z-20 rounded-[2rem] flex items-center justify-center backdrop-blur-[1px]">
                                                            <span className="text-5xl drop-shadow-md">❌</span>
                                                        </div>
                                                        <div className="opacity-60 scale-90 md:scale-100 transform origin-center">{renderStationSign(t)}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {appState === 'PICK1' && (
                                        <div className="flex flex-col items-center w-full max-w-3xl bg-white p-8 rounded-[2rem] shadow-xl border-4 border-purple-500">
                                            <div className="bg-purple-500 text-white px-6 py-2 rounded-full font-black text-xl mb-4 shadow-md flex items-center gap-2">
                                                <span>🔁</span> 환승역 발생: 2개 중 1개 선택
                                            </div>
                                            <p className="text-gray-600 mb-8 font-medium text-center">
                                                아래 두 노선 중 원하는 하나를 선택하여 기록하세요.<br/>
                                                <span className="text-red-500 text-sm mt-1 inline-block">* 단, '타일 2개 제거(🗑️)' 타일이 나왔다면 해당 타일은 선택할 수 없습니다.</span>
                                            </p>
                                            <div className="flex justify-center gap-4 md:gap-12 w-full">
                                                {currentDraw.subs.map((t, idx) => (
                                                    <div key={idx} className="transform hover:-translate-y-2 transition-transform duration-300">
                                                        {renderStationSign(t)}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* 티켓 발권(뽑기) 버튼 */}
                        <div className="flex justify-center my-8 relative z-20">
                            <button 
                                onClick={handleDraw} 
                                disabled={deck.length === 0}
                                className={`group relative w-64 h-20 rounded-2xl font-black text-2xl tracking-widest overflow-hidden shadow-[0_8px_0_rgb(0,0,0,0.2)] active:shadow-[0_0px_0_rgb(0,0,0,0.2)] active:translate-y-2 transition-all
                                    ${deck.length === 0 ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-slate-800 text-white hover:bg-slate-900'}`}
                            >
                                {/* 슬라이딩 하이라이트 효과 */}
                                {deck.length > 0 && <div className="absolute top-0 -left-[100%] w-1/2 h-full bg-white/20 skew-x-[45deg] group-hover:animate-[slide_0.5s_ease-in-out]"></div>}
                                {deck.length === 0 ? '운행 종료' : '티켓 발권'}
                            </button>
                        </div>

                        {/* 하단 노선도 히스토리 영역 */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                            {/* 통과한 역 (히스토리) */}
                            <div className="md:col-span-3 bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                <h3 className="text-sm font-bold text-gray-400 mb-4 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-green-500"></span> 지나온 역 (최근 순)
                                </h3>
                                <div className="flex overflow-x-auto pb-4 pt-2 px-2 space-x-4 items-center min-h-[80px]">
                                    {history.length === 0 ? (
                                        <span className="text-gray-300 text-sm font-medium">아직 출발하지 않았습니다.</span>
                                    ) : (
                                        [...history].reverse().map((t, idx) => renderRouteMarker(t, idx))
                                    )}
                                </div>
                            </div>

                            {/* 철거된 역 (제거된 타일) */}
                            <div className="bg-slate-100 p-5 rounded-2xl shadow-inner border border-slate-200">
                                <h3 className="text-sm font-bold text-red-400 mb-4 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-red-500"></span> 폐쇄된 역 (제거)
                                </h3>
                                <div className="flex flex-wrap gap-2">
                                    {removedTiles.length === 0 ? (
                                        <span className="text-gray-400 text-sm font-medium">폐쇄된 역 없음</span>
                                    ) : (
                                        removedTiles.map((t, idx) => (
                                            <div key={idx} className={`w-10 h-10 rounded flex items-center justify-center font-bold text-sm bg-white border-2 opacity-60 grayscale ${t.border} ${t.color}`}>
                                                {t.value}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        @keyframes slide {
            0% { left: -100%; }
            100% { left: 200%; }
        }
    </style>
</body>
</html>
